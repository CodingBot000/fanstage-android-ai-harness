services:
  chat:
    ports: !override
      - "127.0.0.1:${FANSTAGE_PORT:-18765}:8080"
    environment:
      FANSTAGE_MEDIA_DIR: /opt/fanstage-media
    volumes:
      - type: bind
        source: ${FANSTAGE_MEDIA_HOST_DIR:?Set FANSTAGE_MEDIA_HOST_DIR}
        target: /opt/fanstage-media
        read_only: true
        bind:
          create_host_path: false
