spring.application.name=fanstage-chat
spring.datasource.url=${FANSTAGE_JDBC_URL}
spring.datasource.username=${FANSTAGE_DB_USER}
spring.datasource.password=${FANSTAGE_DB_PASSWORD}
spring.flyway.enabled=true
server.port=8080
server.error.include-message=never
server.address=${FANSTAGE_SERVER_BIND:127.0.0.1}
