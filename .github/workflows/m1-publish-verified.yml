name: M1-002 publish previously verified Android sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-publish-verified.yml'

concurrency:
  group: fanstage-m1-002-publish-verified
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'CodingBot000/fanstage-android-ai-harness' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Verify source build gate in prior workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh api 'repos/CodingBot000/fanstage-android-ai-harness/actions/runs/41699243951/jobs?per_page=100' --jq '[.jobs[] | select(.name == "verify") | .conclusion] | first')"
          test "$result" = "success"
          echo "PASS: upstream M1-002 Android verify job was successful"

      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified source artifact
        uses: actions/download-artifact@v4
        with:
          name: m1-002-verified-source
          run-id: '41699243951'
          github-token: ${{ github.token }}

      - name: Check artifact and canonicalize generated ignore file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('m1-002-report.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          assert obj['task_id'] == 'M1-002'
          assert obj['scope'] == 'ANDROID_FOUNDATION'
          assert obj['code_generated'] is True
          assert obj['verification'] == 'NOT_RUN'
          assert Path('android/app/build.gradle.kts').is_file()
          assert Path('android/core/model/build.gradle.kts').is_file()
          assert Path('android/feature/live/build.gradle.kts').is_file()
          assert Path('android/gradle/wrapper/gradle-wrapper.jar').is_file()
          assert not Path('backend').exists()
          for path in Path('android').rglob('*'):
              assert not path.is_symlink(), f'unexpected symlink {path}'
          ignore = Path('android/.gitignore')
          before = ignore.read_text(encoding='utf-8')
          after = before.rstrip('\n') + '\n'
          ignore.write_text(after, encoding='utf-8')
          assert before == after + '\n' or before == after, 'Unexpected ignore-file whitespace change'
          print('PASS: only trailing blank newline normalized in Android .gitignore')
          PY

      - name: Record validated source and create one review PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_URL: https://github.com/CodingBot000/fanstage-android-ai-harness/actions/runs/41699243951
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="feat/m1-002-android-foundation-verified"
          git switch -c "$branch"
          mkdir -p harness/reviews
          cp m1-002-report.json harness/reviews/M1-002-codex-report.json
          python3 - <<'PY'
          import os
          from pathlib import Path
          status = Path('docs/STATUS.md')
          s = status.read_text(encoding='utf-8')
          assert '- State: IN_PROGRESS' in s
          s = s.replace('- State: IN_PROGRESS', '- State: REVIEW', 1)
          s = s.replace('Current task: M1-001 (설계·공식 호환성 조사 완료), 다음 작업 M1-002',
                        'Current task: M1-002 — verified source PR review')
          s = s.replace('Next action: M1-002 Codex로 최소 Android 프로젝트 생성 → CI 클린 빌드·Lint·Unit 검증',
                        'Next action: M1-002 source PR code review/merge then M1-003 persistent PR CI and emulator testing')
          s += '\n- M1-002 saved Android source reviewed in PR; CI build/lint/unit PASS, emulator NOT_RUN.\n'
          status.write_text(s, encoding='utf-8')
          with Path('harness/build-log.md').open('a', encoding='utf-8') as out:
              out.write('\n## M1-002 — Verified Android source ready for review (2026-11-04)\n\n')
              out.write('- Build source: preserved Codex artifact from Run #41696988901; no additional Codex API invocation.\n')
              out.write(f"- CI PASS: {os.environ['EVIDENCE_URL']} verify job #126137862506: assembleDebug/lintDebug/testDebugUnitTest.\n")
              out.write('- Publish source: validated artifact from that run; Android .gitignore extra blank newline removed without changing source code.\n')
              out.write('- Original plan/report: harness/reviews/M1-002-codex-report.json.\n')
              out.write('- NOT_RUN: emulator/device install and manual navigation UX; M1 Gate pending.\n')
              out.write('- Human review: requested via PR.\n')
          PY
          git add android/ docs/STATUS.md harness/build-log.md harness/reviews/M1-002-codex-report.json
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'feat(m1): add CI-verified Compose Android foundation'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title 'feat(m1): add CI-verified Compose Android foundation' \
            --body "M1-002 only. Android three-module Compose, FakeRepository, room list/detail, unit tests. Verified build/lint/unit: ${EVIDENCE_URL}. M1 overall Gate and device UI validation remain pending."
