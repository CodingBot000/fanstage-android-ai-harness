name: Android PR build and unit gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up preinstalled Android SDK manager and API 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" --version
          "$manager" --channel=3 --install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"

      - name: Build Android and run deterministic PR gates
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug :app:lintDebug testDebugUnitTest --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-ci.log"

      - name: Upload logs and unit test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-gate-evidence
          path: |
            android-ci.log
            android/**/build/test-results/testDebugUnitTest/*.xml
            android/**/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

  emulator-compose-smoke:
    name: Emulator API 35 / Compose navigation smoke
    needs: build-lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install compilation SDK 37.0 independently from emulator API 35
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" --channel=3 --install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"

      - name: Enable KVM on Linux runner
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      # v2 annotated tag resolves to this commit (2026-07-05).
      # No secret or write-capable GITHUB_TOKEN is supplied to this third-party action.
      - name: Boot emulator and run connected Compose smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            chmod +x gradlew
            adb devices -l
            adb shell getprop ro.build.version.sdk
            adb logcat -c
            trap 'adb logcat -d -t 1200 -s AndroidRuntime:E TestRunner:I ActivityTaskManager:I > "$GITHUB_WORKSPACE/android-emulator-logcat.txt" || true' EXIT
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-emulator-test.log"
            adb shell pm path dev.fanstage.android

      - name: Upload original connected test result and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-compose-smoke-evidence
          path: |
            android-emulator-test.log
            android-emulator-logcat.txt
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
