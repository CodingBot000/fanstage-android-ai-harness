name: Android PR build and unit gates

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/m1-004-emulator-smoke.sh'
      - 'scripts/ux012-emulator-gate.sh'
      - 'scripts/m4-check-manifests.py'
      - 'scripts/m6-check-manifests.py'
      - 'scripts/check-ux-module-boundaries.py'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up preinstalled Android SDK manager and API 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" --version
          "$manager" --channel=3 --install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"

      - name: Build Android and run deterministic PR gates
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # A clean hosted runner may create an ephemeral Android debug key for
          # Debug/Benchmark tests. It is never used to sign a public release.
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:assembleRcLocal :app:assembleBenchmark :macrobenchmark:assembleBenchmark :app:lintDebug testDebugUnitTest :core:data:test --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-ci.log"
          python3 ../scripts/m4-check-manifests.py
          python3 ../scripts/m6-check-manifests.py
          python3 ../scripts/check-ux-module-boundaries.py
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/benchmark/app-benchmark.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify macrobenchmark/build/outputs/apk/benchmark/macrobenchmark-benchmark.apk

      # The default build compiles only the ordinary AndroidJUnitRunner test sources.
      # Hilt tests live in a property-gated source set and must be compiled independently.
      - name: Compile Hilt-specific AndroidTest sources with Hilt test runner
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebugAndroidTest -PfanstageHiltInstrumentation=true --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/hilt-androidtest-ci.log"

      # Recheck the default variant after switching source sets to catch generated-code leaks.
      - name: Recompile ordinary AndroidTest after Hilt source-set switch
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/default-androidtest-after-hilt-ci.log"

      - name: Upload logs and unit test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-gate-evidence
          path: |
            android-ci.log
            hilt-androidtest-ci.log
            default-androidtest-after-hilt-ci.log
            android/**/build/test-results/testDebugUnitTest/*.xml
            android/core/data/build/test-results/test/*.xml
            android/**/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14
