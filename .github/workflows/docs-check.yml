name: Portfolio documentation integrity

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'android/README.md'
      - 'backend/chat-server/README.md'
      - 'docs/**'
      - 'scripts/check-portfolio-docs.py'
      - 'scripts/check-verification-evidence.py'
      - 'scripts/tests/test_verification_evidence.py'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'android/README.md'
      - 'backend/chat-server/README.md'
      - 'docs/**'
      - 'scripts/check-portfolio-docs.py'
      - 'scripts/check-verification-evidence.py'
      - 'scripts/tests/test_verification_evidence.py'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links-and-adr-ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify internal Markdown links and ADR IDs
        run: python3 scripts/check-portfolio-docs.py
      - name: Test evidence checker against invalid fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_verification_evidence.py' -v
      - name: Verify published evidence integrity and provenance
        run: python3 scripts/check-verification-evidence.py
